
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSAP Card Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="hero-section">
    <h1 class="hero-title">START</h1>
  </section>

  <section class="cards-section">
    <div class="cards-stage">

      <div class="card">
        <img src="assets/image-1.jpg" alt="Card image 1" />
      </div>

      <div class="card">
        <img src="assets/image-2.jpg" alt="Card image 2" />
      </div>

      <div class="card">
        <img src="assets/image-3.jpg" alt="Card image 3" />
      </div>

      <div class="card">
        <img src="assets/image-4.jpg" alt="Card image 4" />
      </div>

    </div>
  </section>

  <section class="outro-section">
    <h1 class="outro-title">THE END</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
